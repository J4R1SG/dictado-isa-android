name: Build Android App

# Neo Records (fork de Dictado Ultra): arma solo la variante sin modelo
# incluido (fdroid). El modelo de voz (GGUF) se importa en la app una vez.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The action installs "tools platform-tools" by default, but the legacy
    # "tools" package no longer exists in the SDK repository.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108" "platforms;android-36"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check engine version
      run: |
        cargo tree -i transcribe-cpp --target aarch64-linux-android --locked | head -3
        cargo tree -i transcribe-cpp --target aarch64-linux-android --locked | head -1 | grep -q "v0.4.2"

    # Clave fija si existe el secreto KEYSTORE_BASE64. Si no, una clave de
    # prueba de un solo uso: esa APK no se puede actualizar encima despues
    # (hay que desinstalar, y eso borra el modelo importado).
    - name: Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        S_KEY_PASS: ${{ secrets.KEY_PASS }}
        S_STORE_PASS: ${{ secrets.STORE_PASS }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "SIGNING=fija"
            echo "KEY_ALIAS=$S_KEY_ALIAS"
            echo "KEY_PASS=$S_KEY_PASS"
            echo "STORE_PASS=$S_STORE_PASS"
          } >> $GITHUB_ENV
        else
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.keystore -alias release -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Dictado Ultra prueba" -noprompt
          {
            echo "SIGNING=prueba"
            echo "KEY_ALIAS=release"
            echo "KEY_PASS=$PASS"
            echo "STORE_PASS=$PASS"
          } >> $GITHUB_ENV
        fi

    # Pruebas de la JVM (SCRAM, filtro de red, certificado fijado, puente).
    - name: Unit tests
      run: ./gradlew testFdroidReleaseUnitTest

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/
        if-no-files-found: ignore

    - name: Build Release APK
      run: ./gradlew assembleFdroidRelease

    - name: Rename APK
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "neo-records-v${VERSION_NAME}-${SIGNING}.apk"
        rm -f release.keystore
        ls -la *.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neo-records-v${{ env.VERSION_NAME }}
        path: neo-records-v${{ env.VERSION_NAME }}-${{ env.SIGNING }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Neo Records v${{ env.VERSION_NAME }}
        prerelease: true
        body: |
          Neo Records para el telefono: dictado sin internet (transcribe.cpp 0.4.2).
          Instala la APK, abre la app e importa el modelo de voz en Ajustes.
          Firma: ${{ env.SIGNING }}.
        files: neo-records-v${{ env.VERSION_NAME }}-${{ env.SIGNING }}.apk

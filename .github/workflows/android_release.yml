name: Build Android App

# Fork "Dictado Ultra": arma solo la variante sin modelo incluido (fdroid).
# El modelo Parakeet Ultra (GGUF) se importa en la app una sola vez.

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # The action installs "tools platform-tools" by default, but the legacy
    # "tools" package no longer exists in the SDK repository.
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;28.0.13004108" "platforms;android-36"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Check engine version
      run: |
        cargo tree -i transcribe-cpp --target aarch64-linux-android --locked | head -3
        cargo tree -i transcribe-cpp --target aarch64-linux-android --locked | head -1 | grep -q "v0.4.2"

    # Clave fija si existe el secreto KEYSTORE_BASE64. Si no, una clave de
    # prueba de un solo uso: esa APK no se puede actualizar encima despues
    # (hay que desinstalar, y eso borra el modelo importado).
    - name: Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "SIGNING=fija" >> $GITHUB_ENV
        else
          keytool -genkeypair -keystore release.keystore -alias release -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass password -keypass password -dname "CN=Dictado Ultra prueba" -noprompt
          echo "SIGNING=prueba" >> $GITHUB_ENV
        fi

    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASS }}
        STORE_PASS: ${{ secrets.STORE_PASS }}
      run: ./gradlew assembleFdroidRelease

    - name: Rename APK
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "dictado-ultra-v${VERSION_NAME}-${SIGNING}.apk"
        rm -f release.keystore
        ls -la *.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dictado-ultra-v${{ env.VERSION_NAME }}
        path: dictado-ultra-v${{ env.VERSION_NAME }}-${{ env.SIGNING }}.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Dictado Ultra v${{ env.VERSION_NAME }}
        prerelease: true
        body: |
          Teclado de dictado sin internet con el motor de Handy (transcribe.cpp 0.4.2).
          Instala la APK, abre la app e importa parakeet-ultra-Q8_0.gguf en "Modelos".
          Firma: ${{ env.SIGNING }}.
        files: dictado-ultra-v${{ env.VERSION_NAME }}-${{ env.SIGNING }}.apk
